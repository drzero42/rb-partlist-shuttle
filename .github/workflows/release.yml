# Publishes the userscript artifact (spec §13).
#
# The pushed tag is the only publish trigger: `dist/` is gitignored, the release
# asset is the distribution channel, and Violentmonkey auto-updates from
# `releases/latest/download/<asset>`. `scripts/release.mjs` never calls
# `gh release create`, so this workflow is the single publisher.
#
# workflow_dispatch runs the same install → test → build → verify chain and
# stops before publishing, so CI can be exercised without cutting a release.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # --check builds and verifies the artifact (banner, @version, @downloadURL)
      # and refuses a tag that disagrees with package.json. No git writes.
      - name: Build and verify artifact
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/release.mjs --check --expect-tag "$GITHUB_REF_NAME"
          else
            node scripts/release.mjs --check
          fi

      # Re-running a tag re-uploads instead of failing on an existing release.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.user.js --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.user.js \
              --verify-tag --latest --generate-notes --title "$GITHUB_REF_NAME"
          fi
